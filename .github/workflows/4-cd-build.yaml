name: 4-Continuous-Delivery-(Build-and-Push-Image)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["3-Model-Training-and-Evaluation"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
          contents: read
          packages: write
          actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model artefacts
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trained-model
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '77555718806' }}
          
      - name: Check deploy decision
        id: deploy_check
        run: |
          if [ -f model/deploy_decision.txt ]; then
            decision=$(head -1 model/deploy_decision.txt)
          else
            decision="NO_DEPLOY"  # No artifact = no improvement
          fi
          echo "decision=$decision" >> $GITHUB_OUTPUT
          echo "Deploy decision: $decision"

      - name: Log in to GitHub Container Registry
        if: steps.deploy_check.outputs.decision == 'DEPLOY'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.deploy_check.outputs.decision == 'DEPLOY'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.deploy_check.outputs.decision == 'DEPLOY'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image digest
        if: steps.deploy_check.outputs.decision == 'DEPLOY'
        run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"
