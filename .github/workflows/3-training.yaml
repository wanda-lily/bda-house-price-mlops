name: 3-Model-Training-and-Evaluation

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - develop

jobs:
  train:
    name: Train RandomForest & Log to MLflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install mlflow scikit-learn pandas numpy joblib

      - name: Download preprocessed data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: processed-data
          path: data/
          github-token: ${{ secrets.DOCKER_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Train model
        env:
          # set env variable
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          DATA_DIR: data
          MODEL_DIR: model
        run: python model/train.py

      - name: Check deploy decision
        id: deploy_check
        run: |
          # Read the first line of model/deploy_decision.txt
          decision=$(head -1 model/deploy_decision.txt) 

          # Expose it as a GitHub Actions output
          echo "decision=$decision" >> $GITHUB_OUTPUT
          cat model/deploy_decision.txt

      - name: Upload model artefacts
        if: steps.deploy_check.outputs.decision == 'DEPLOY'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            model/price_model.pkl
            model/deploy_decision.txt
            data/county_encoder.csv
          retention-days: 7

      - name: Skip notice
        if: steps.deploy_check.outputs.decision != 'DEPLOY'
        run: echo "Model did not improve on baseline — skipping artefact upload."
