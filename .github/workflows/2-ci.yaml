name: 2-Continuous-Integration

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-and-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 data/ model/ api/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__

      - name: Type check with mypy
        run: |
          mypy api/app.py model/train.py data/preprocess.py \
            --ignore-missing-imports \
            --no-strict-optional

      - name: Download preprocessed data artefact (if available)
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
        continue-on-error: true # OK if no artefact yet; data tests are skipped

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 3
